<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1b16" />
    <title>Our Block</title>
    <meta name="description" content="Walk London. Stack social homes. Luxury is the trap." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="./css/desk.css?v=ob6" />
    <link rel="stylesheet" href="./css/council.css?v=ob6" />
  </head>
  <body class="cb">
    <div id="desk">
      <section id="map-wrap" class="is-landing is-3d">
        <div id="gl-map" class="gl-map" role="application" aria-label="London map"></div>
        <svg id="map" hidden aria-hidden="true"></svg>
      </section>
    </div>

    <div id="landing" class="cb-screen">
      <p class="cb-kicker">London · social homes</p>
      <h1 class="cb-wordmark">Our Block</h1>
      <p class="cb-tag">Walk the city. Stack homes for the list. Gold is the trap.</p>
      <button type="button" id="walk-london" class="cb-go">Walk London</button>
    </div>

    <header id="walk-hud" hidden>
      <div class="cb-score" id="cb-score">
        <span class="cb-score-label">Social homes</span>
        <b id="cb-score-num">0</b>
      </div>
      <div class="cb-boro" id="cb-boro">London</div>
    </header>

    <aside id="talk" hidden>
      <img id="talk-face" class="talk-face" src="./assets/faces/andy.png" alt="Andy" width="72" height="72" />
      <div class="talk-panel">
        <p class="talk-who">Andy</p>
        <p id="talk-line" class="talk-line"></p>
        <div class="talk-row">
          <button type="button" id="talk-next" class="cb-quiet">Next</button>
          <button type="button" id="talk-stack" class="cb-go" hidden>STACK</button>
        </div>
      </div>
    </aside>

    <div id="stack" hidden>
      <div id="stack-haze" aria-hidden="true"></div>
      <canvas id="stack-canvas"></canvas>
      <div id="stack-hud">
        <span id="stack-social">Social 0</span>
        <span id="stack-hp" aria-label="lives">♥♥♥</span>
        <span id="stack-floors">0 / 0</span>
      </div>
      <p id="stack-site"></p>
      <p id="stack-hint">Tap to drop · brick is homes · glass is the trap</p>
    </div>

    <p id="boot-status">Loading London…</p>
    <script>if (/[?&]scene=stack/.test(location.search)) { var el = document.getElementById("landing"); if (el) el.hidden = true; var w = document.getElementById("map-wrap"); if (w) w.classList.remove("is-landing"); }</script>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script type="module" src="./src/main.js?v=ob6"></script>
  </body>
</html>
